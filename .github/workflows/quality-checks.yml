name: App quality checks

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: quality-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    name: TypeScript, production build, and smoke tests
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Install dependencies
        run: npm install
      - name: Check FCC installer wrapper syntax
        run: bash -n scripts/install-fcc.sh
      - name: Check TypeScript
        run: npm run lint
      - name: Build production app
        run: npm run build
      - name: Run production smoke tests
        run: npm test
