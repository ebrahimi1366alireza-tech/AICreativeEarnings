name: Compile agentic workflow

on:
  pull_request:
    branches: [main]
    paths:
      - ".github/workflows/executive-agent.md"
      - ".github/workflows/agent-workflow-compile.yml"
  push:
    branches:
      - "chore/activate-creative-earnings-agent-team"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  compile:
    if: github.event_name == 'workflow_dispatch' || github.event_name == 'push' || github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    steps:
      - name: Check out source
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - name: Install GitHub Agentic Workflows CLI
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh extension install github/gh-aw
          gh aw version
      - name: Compile and strictly validate executive agent
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh aw compile .github/workflows/executive-agent.md --validate --strict
      - name: Commit generated lock file
        if: github.event_name == 'pull_request' || github.event_name == 'workflow_dispatch'
        env:
          BRANCH_NAME: ${{ github.event.pull_request.head.ref || github.ref_name }}
          WORKFLOW_PUSH_TOKEN: ${{ secrets.GH_AW_WORKFLOW_PUSH_TOKEN }}
        run: |
          if [ -z "$WORKFLOW_PUSH_TOKEN" ]; then
            echo "::warning::GH_AW_WORKFLOW_PUSH_TOKEN is not configured. The validated lock file will be uploaded as an artifact but not committed."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add .github/workflows/executive-agent.lock.yml
          if git diff --cached --quiet; then
            echo "Generated lock file is already current."
            exit 0
          fi
          git commit -m "chore: compile executive agent workflow"
          git remote set-url origin "https://x-access-token:${WORKFLOW_PUSH_TOKEN}@github.com/${GITHUB_REPOSITORY}.git"
          git push origin "HEAD:${BRANCH_NAME}"
      - name: Upload generated lock file for review
        uses: actions/upload-artifact@v4
        with:
          name: executive-agent-lock
          path: .github/workflows/executive-agent.lock.yml
          if-no-files-found: error
          retention-days: 3
