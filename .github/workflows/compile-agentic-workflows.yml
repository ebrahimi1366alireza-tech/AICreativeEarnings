name: Compile GitHub Agentic Workflows

on:
  pull_request:
    branches: [main]
    paths:
      - ".github/workflows/*.md"
      - ".github/workflows/compile-agentic-workflows.yml"
  push:
    branches: [main]
    paths:
      - ".github/workflows/*.md"
      - ".github/workflows/compile-agentic-workflows.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: compile-agentic-workflows
  cancel-in-progress: false

jobs:
  compile:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Install GitHub Agentic Workflows CLI extension
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh extension install github/gh-aw
          gh aw version

      - name: Compile and validate agent workflows
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh aw compile --validate --strict

      - name: Upload generated lock files
        uses: actions/upload-artifact@v4
        with:
          name: gh-aw-lock-files
          path: .github/workflows/*.lock.yml
          if-no-files-found: error

  publish:
    needs: compile
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      contents: write
      workflows: write
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          persist-credentials: true

      - name: Download generated lock files
        uses: actions/download-artifact@v4
        with:
          name: gh-aw-lock-files
          path: .github/workflows

      - name: Commit generated lock files
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add .github/workflows/*.lock.yml
          if git diff --cached --quiet; then
            echo "No generated workflow changes."
          else
            git commit -m "chore: compile GitHub Agentic Workflows"
            git push
          fi
