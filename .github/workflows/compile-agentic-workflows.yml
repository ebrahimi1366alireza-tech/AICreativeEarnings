name: Compile GitHub Agentic Workflows

on:
  pull_request:
    branches: [main]
    paths:
      - ".github/workflows/*.md"
      - ".github/workflows/compile-agentic-workflows.yml"
  push:
    branches: [main]
    paths:
      - ".github/workflows/*.md"
      - ".github/workflows/compile-agentic-workflows.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: compile-agentic-workflows
  cancel-in-progress: false

jobs:
  compile:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Install GitHub Agentic Workflows CLI extension
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh extension install github/gh-aw
          gh aw version

      - name: Compile and validate agent workflows
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh aw compile --validate --strict

      - name: Upload generated lock files
        uses: actions/upload-artifact@v4
        with:
          name: gh-aw-lock-files
          path: .github/workflows/*.lock.yml
          if-no-files-found: error
